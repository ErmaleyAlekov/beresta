# ============================================================================
#  CI «Берёсты»: сборка и тесты на каждый push и pull request
#
#  Матрица покрывает всё, что попадает в релиз: Linux x64 и arm64, Windows
#  x64 и arm64 (MSVC), macOS universal (Intel + Apple Silicon, вторая
#  архитектура проверяется через Rosetta), WebAssembly. Отдельно —
#  санитайзеры (ASan, UBSan, LeakSanitizer) и W3C XML Conformance Test Suite.
#  Используются только официальные действия GitHub (actions/*).
# ============================================================================
#  Beresta CI: build and tests on every push and pull request
#
#  The matrix covers everything that goes into a release: Linux x64 and arm64, Windows
#  x64 and arm64 (MSVC), macOS universal (Intel + Apple Silicon, the second
#  architecture is checked through Rosetta), WebAssembly. Separately —
#  sanitizers (ASan, UBSan, LeakSanitizer) and the W3C XML Conformance Test Suite.
#  Only official GitHub actions (actions/*) are used.
# ============================================================================
name: CI

# Push в любую ветку и pull request; повторный прогон того же коммита в PR
# отменяется через concurrency ниже
# A push to any branch and a pull request; a repeated run of the same commit in a PR
# is cancelled through concurrency below
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Новый push в ту же ветку отменяет устаревший прогон / A new push to the same branch cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Linux: Makefile (GCC) и CMake (Clang), все обёртки ----------------------
  # ---- Linux: Makefile (GCC) and CMake (Clang), all wrappers ----------------------
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # PHP с расширением ffi для самопроверки PHP-обёртки (младшая поддерживаемая версия — 8.2)
      # PHP with the ffi extension for the PHP binding self-test (the oldest supported version is 8.2)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ffi
          ini-values: ffi.enable=1
          tools: none
      - name: Make (GCC) + тесты C++ / tests
        run: make -j"$(nproc)" && make test
      - name: Обёртки / Wrappers (Java, C#, Python, PHP, Node.js)
        run: make -j"$(nproc)" JAVA=1 CSHARP=1 PYTHON=1 PHP=1 NODE=1 bindings-test
      - name: CMake (Clang) + ctest
        run: |
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DBERESTA_BUILD_TESTS=ON -DBERESTA_BUILD_NODE=ON -DBERESTA_BUILD_PYTHON=ON
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

  # ---- Windows: CMake + MSVC ---------------------------------------------------
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            bindings: -DBERESTA_BUILD_JAVA=ON -DBERESTA_BUILD_CSHARP=ON -DBERESTA_BUILD_PYTHON=ON -DBERESTA_BUILD_NODE=ON
          - arch: ARM64
            runner: windows-11-arm
            bindings: -DBERESTA_BUILD_PYTHON=ON -DBERESTA_BUILD_NODE=ON
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.arch == 'x64'
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@v4
        if: matrix.arch == 'x64'
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CMake + MSVC + ctest
        run: |
          cmake -S . -B build -A ${{ matrix.arch }} -DBERESTA_BUILD_TESTS=ON ${{ matrix.bindings }}
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

  # ---- macOS: универсальный бинарник (x86_64 + arm64) --------------------------
  # ---- macOS: the universal binary (x86_64 + arm64) --------------------------
  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: make universal (lipo)
        run: |
          make -j"$(sysctl -n hw.ncpu)" universal
          lipo -info bin/libberesta.dylib | grep -q 'x86_64 arm64'
          lipo -info bin/beresta.node | grep -q 'x86_64 arm64'
      - name: Обёртки на универсальном бинарнике / Wrappers on the universal binary
        run: |
          cd bindings/node && node --test && cd ../python && python3 -m unittest discover -s tests
      - name: CMake universal + тесты обеих архитектур / tests of both architectures
        run: |
          cmake -S . -B build -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DBERESTA_BUILD_TESTS=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ./build/beresta_tests
          arch -x86_64 ./build/beresta_tests

  # ---- WebAssembly: Emscripten из официального образа --------------------------
  # ---- WebAssembly: Emscripten from the official image --------------------------
  wasm:
    name: WebAssembly
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:3.1.69
    steps:
      - uses: actions/checkout@v4
      # В образе emsdk в PATH есть каталог /emsdk с подкаталогом node: bash его
      # пропускает, а GNU make пытается запустить каталог и падает с «Permission
      # denied». Поэтому make получает абсолютный путь к node
      # In the emsdk image PATH contains the /emsdk directory with a node subdirectory: bash
      # skips it, but GNU make tries to run the directory and fails with "Permission
      # denied". That is why make gets the absolute path to node
      - name: make wasm-test
        run: make -j"$(nproc)" NODE_EXE="$(command -v node)" wasm-test
      - name: CMake (emcmake) + ctest
        run: |
          emcmake cmake -S . -B build-wasm -DBERESTA_BUILD_TESTS=ON
          cmake --build build-wasm -j"$(nproc)"
          ctest --test-dir build-wasm --output-on-failure

  # ---- Санитайзеры: утечки, неопределённое поведение, выход за границы -----------
  # ---- Sanitizers: leaks, undefined behavior, out-of-bounds access -----------
  sanitizers:
    name: ASan + UBSan + LSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Тесты под санитайзерами / Tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          make -j"$(nproc)" OBJ_DIR=objsan DEP_DIR=depsan BIN_DIR=binsan \
            "CXXFLAGS=-std=c++17 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all -D_GLIBCXX_ASSERTIONS" \
            binsan/beresta_tests
          ./binsan/beresta_tests

  # ---- Соответствие стандарту: W3C XML Conformance Test Suite --------------------
  # ---- Standard conformance: the W3C XML Conformance Test Suite --------------------
  conformance:
    name: W3C XML Conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Прогонщик всегда возвращает 0 (провалы — в отчёте), поэтому CI сам
      # проверяет строку ИТОГО: третий столбец — число провалов, он обязан быть 0
      # The runner always returns 0 (failures go to the report), so CI itself
      # checks the ИТОГО (total) line: the third column is the failure count, it must be 0
      - name: make fetch && make run
        run: |
          cd tests/conformance && make fetch && make -j"$(nproc)" run | tee run.log
          awk '/ИТОГО/ { found = 1; if ($3 != 0) exit 1 } END { if (!found) exit 1 }' run.log
