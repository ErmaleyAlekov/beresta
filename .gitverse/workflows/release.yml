# ============================================================================
#  Релиз «Берёсты» на Gitverse по тегу vX.Y.Z
#
#  Файлы, которые можно собрать на Gitverse (в России), собираются здесь:
#    linux   — SDK Linux x86_64 и aarch64 в образе Astra Linux SE 1.7 (GCC 8.3,
#              glibc 2.28), тесты x86_64 и aarch64 (в qemu); не вышло — тот же
#              скрипт на раннере Ubuntu;
#    windows — SDK Windows x86_64 кросс-компилятором MinGW-w64.
#  Из релиза GitHub берётся только то, что здесь собрать нечем: SDK macOS
#  (оборудование Apple) и Windows ARM64 (MSVC ARM64), а также пакеты npm, PyPI,
#  NuGet, Maven и WebAssembly — это те же файлы, что опубликованы в реестрах
#  (публикация в реестры — только из .github/workflows/release.yml).
#  Сначала задача create создаёт релиз с описанием, затем три задачи параллельно
#  добавляют в него файлы (артефакты между задачами на Gitverse не передаются,
#  поэтому каждая задача загружает свои файлы сама). Лимит — 30 минут на задачу.
#  Повтор вручную: CI/CD → Release → запустить с параметром tag — файлы заменяются.
#  Нужен секрет репозитория GV_API_TOKEN: токен gitverse.ru с правом
#  «Репозитории → Запись» (префикс GITVERSE_ у секретов запрещён).
# ============================================================================
#  The Beresta release on Gitverse by the vX.Y.Z tag
#
#  The files that can be built on Gitverse (in Russia) are built here:
#    linux   — the Linux x86_64 and aarch64 SDK in the Astra Linux SE 1.7 image (GCC 8.3,
#              glibc 2.28), the x86_64 and aarch64 tests (in qemu); if it fails — the same
#              script on the Ubuntu runner;
#    windows — the Windows x86_64 SDK with the MinGW-w64 cross compiler.
#  Only what cannot be built here is taken from the GitHub release: the macOS SDK
#  (Apple hardware) and Windows ARM64 (MSVC ARM64), and the npm, PyPI, NuGet, Maven
#  and WebAssembly packages — the same files that are published to the registries
#  (registry publishing is done only by .github/workflows/release.yml).
#  First the create job creates the release with the notes, then three jobs in parallel
#  add files to it (artifacts are not passed between jobs on Gitverse, so each
#  job uploads its own files). The limit is 30 minutes per job.
#  A manual repeat: CI/CD → Release → run with the tag parameter — the files are replaced.
#  The GV_API_TOKEN repository secret is needed: a gitverse.ru token with the
#  "Repositories → Write" right (the GITVERSE_ prefix is forbidden for secrets).
# ============================================================================
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v2.1.4 / The release tag, e.g. v2.1.4'
        required: true

env:
  # Тег: из ручного запуска или из события push / The tag: from a manual run or from the push event
  TAG: ${{ inputs.tag || gitverse.ref_name }}

jobs:
  create:
    name: Релиз / Release
    runs-on: ubuntu-latest
    env:
      GV_API_TOKEN: ${{ secrets.GV_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Скрипты релиза — из ветки запуска (при ручном запуске это main), а не из тега:
      # исправления скриптов работают и для уже выпущенного тега
      # The release scripts come from the run branch (main for a manual run), not from the tag:
      # script fixes work for an already released tag too
      - uses: actions/checkout@v4
        with:
          path: .release-tools
      - name: Секрет и инструменты / The secret and tools
        shell: bash
        run: |
          if [ -z "$GV_API_TOKEN" ]; then
            echo "Нет секрета GV_API_TOKEN (Настройки → Секреты и переменные) / No GV_API_TOKEN secret"; exit 1
          fi
          sudo=""
          if [ "$(id -u)" != "0" ]; then sudo="sudo"; fi
          $sudo apt-get update -qq && $sudo apt-get install -y -qq curl python3 zip
      # Версия тега обязана совпадать с версией проекта / The tag version must match the project version
      - name: Проверка версии / Version check
        shell: bash
        run: |
          version=$(sed -n 's/^project(beresta VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$TAG" != "v$version" ]; then
            echo "Тег $TAG не совпадает с версией $version / The tag does not match the version"; exit 1
          fi
      - name: Описание и релиз / The notes and the release
        shell: bash
        run: |
          bash .release-tools/tools/release/release_notes.sh "${TAG#v}" notes.md
          cat .release-tools/tools/release/gitverse_notes.md >> notes.md
          bash .release-tools/tools/release/gitverse_release.sh "$TAG" notes.md

  linux:
    name: Linux x86_64 + aarch64 (Astra Linux SE 1.7)
    needs: create
    runs-on: ubuntu-latest
    env:
      GV_API_TOKEN: ${{ secrets.GV_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/checkout@v4
        with:
          path: .release-tools
      - name: Сборка в Astra Linux SE 1.7 / The build in Astra Linux SE 1.7
        id: astra
        continue-on-error: true
        uses: docker://registry.astralinux.ru/library/astra/ubi17:latest
        with:
          entrypoint: bash
          args: .release-tools/tools/release/build_linux.sh ${{ env.TAG }} dist
      # Запасной путь: образ Astra недоступен — сборка на раннере (glibc раннера)
      # The fallback: the Astra image is unavailable — the build on the runner (the runner glibc)
      - name: Сборка на раннере / The build on the runner
        if: steps.astra.outcome != 'success'
        shell: bash
        run: bash .release-tools/tools/release/build_linux.sh "$TAG" dist
      - name: Файлы в релиз / Files into the release
        shell: bash
        run: |
          sudo=""
          if [ "$(id -u)" != "0" ]; then sudo="sudo"; fi
          $sudo apt-get update -qq && $sudo apt-get install -y -qq curl python3 zip
          bash .release-tools/tools/release/gitverse_release.sh "$TAG" /dev/null dist/*.zip

  windows:
    name: Windows x86_64 (MinGW-w64)
    needs: create
    runs-on: ubuntu-latest
    env:
      GV_API_TOKEN: ${{ secrets.GV_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/checkout@v4
        with:
          path: .release-tools
      - name: Сборка / The build
        shell: bash
        run: bash .release-tools/tools/release/build_windows.sh "$TAG" dist
      - name: Файлы в релиз / Files into the release
        shell: bash
        run: |
          sudo=""
          if [ "$(id -u)" != "0" ]; then sudo="sudo"; fi
          $sudo apt-get install -y -qq curl python3 zip
          bash .release-tools/tools/release/gitverse_release.sh "$TAG" /dev/null dist/*.zip

  github:
    name: macOS, Windows ARM64, пакеты / packages (GitHub)
    needs: create
    runs-on: ubuntu-latest
    env:
      GV_API_TOKEN: ${{ secrets.GV_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: .release-tools
      - name: Инструменты / Tools
        shell: bash
        run: |
          sudo=""
          if [ "$(id -u)" != "0" ]; then sudo="sudo"; fi
          $sudo apt-get update -qq && $sudo apt-get install -y -qq curl python3 zip
      # Релиз GitHub собирается ~20–30 минут: ждём до 25. SDK Linux и Windows x86_64
      # собраны на Gitverse, поэтому их копии с GitHub не берутся
      # The GitHub release takes ~20–30 minutes: wait up to 25. The Linux and Windows x86_64 SDKs
      # are built on Gitverse, so their GitHub copies are not taken
      - name: Файлы релиза GitHub / The GitHub release files
        shell: bash
        run: |
          bash .release-tools/tools/release/github_assets.sh "$TAG" mirror 25
          rm -f mirror/*-linux-x86_64.zip mirror/*-linux-aarch64.zip mirror/*-windows-x86_64.zip
          bash .release-tools/tools/release/gitverse_release.sh "$TAG" /dev/null mirror/*
