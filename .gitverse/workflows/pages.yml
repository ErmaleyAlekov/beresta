# ============================================================================
#  Публикация сайта продукта (каталог site/) на Gitverse Pages
#  Запускается при изменении site/ в main или вручную. Источник страниц в
#  настройках репозитория — «Воркфлоу». Адрес: https://ermaleyalekov.gitverse.site/beresta
# ============================================================================
#  Publishing the product site (the site/ directory) to Gitverse Pages
#  Runs on changes of site/ in main or manually. The pages source in the
#  repository settings is "Workflow". Address: https://ermaleyalekov.gitverse.site/beresta
# ============================================================================
name: Pages

on:
  push:
    branches: [ "main" ]
    paths: [ "site/**", ".gitverse/workflows/pages.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Статика уже лежит в репозитории: сборка не нужна, только проверка
      # The static files are already in the repository: no build, only a check
      - name: Check site
        run: test -f site/index.html && test -f site/docs/operation.pdf

      - name: Upload pages artifact
        uses: gitverse/upload-pages-artifact@v1.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: gitverse/deploy-pages@v1.0.0
